services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    restart: unless-stopped

  dev:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
      - "8787:8787"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      VITE_API_URL: http://127.0.0.1:8787
    command: npm run dev:full
