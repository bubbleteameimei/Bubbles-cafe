services:
  - type: web
    name: bubbles-cafe-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: NODE_OPTIONS
        value: '--enable-source-maps --dns-result-order=ipv4first'
      - key: NPM_CONFIG_PRODUCTION
        value: 'false'
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Reduce Postgres pool idle to close connections quickly when idle
      - key: DB_POOL_IDLE_MS
        value: "5000"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MIN
        value: "0"
      - key: DB_POOL_CONN_TIMEOUT_MS
        value: "10000"
      # Disable background WordPress scheduler by default in production
      - key: ENABLE_WORDPRESS_SCHEDULER
        value: "false"
      # Public site and backend base URLs used by sitemap generation during build
      - key: SITE_URL
        value: "https://bubblescafe.space"
      - key: BACKEND_BASE_URL
        value: "https://api.bubblescafe.space"
      
    autoDeploy: true

databases:
  - name: bubbles-cafe-db
    databaseName: bubbles_cafe
    plan: starter
    postgresMajorVersion: 14
