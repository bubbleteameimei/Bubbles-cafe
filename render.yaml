services:
  - type: web
    name: bubbles-cafe-api
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://bubblescafe.space
      - key: BACKEND_BASE_URL
        value: https://api.bubblescafe.space
      - key: ENABLE_WORDPRESS_SCHEDULER
        value: "true"
      - key: DISABLE_LOCAL_AUTH
        value: "false"
      - key: WORDPRESS_API
        value: https://public-api.wordpress.com/wp/v2/sites/bubbleteameimei.wordpress.com/posts?per_page=100
      - key: PAYSTACK_LINK
        value: https://paystack.shop/pay/z7fmj9rge1
      - key: GOOGLE_LOGIN_URI
        value: https://api.bubblescafe.space/api/auth/login/google
      - key: GOOGLE_REDIRECT_URI
        value: https://api.bubblescafe.space/api/auth/callback
      - key: GMAIL_ADMIN_EMAIL
        value: vantalison@gmail.com
      - key: DATABASE_URL
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_POOLER_URL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
