services:
  - type: web
    name: bubbles-cafe-backend
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: NODE_OPTIONS
        value: '--enable-source-maps --dns-result-order=ipv4first'
      - key: NPM_CONFIG_PRODUCTION
        value: 'false'
      - key: DATABASE_URL
        sync: false
      # Prefer Supabase connection pooler URL when provided; set this secret to your pooler connection string
      - key: SUPABASE_POOLER_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: CSRF_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://bubblescafe.space"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Reduce Postgres pool idle to close connections quickly when idle
      - key: DB_POOL_IDLE_MS
        value: "5000"
      - key: DB_POOL_MAX
        value: "5"
      - key: DB_POOL_MIN
        value: "0"
      - key: DB_POOL_CONN_TIMEOUT_MS
        value: "10000"
      # Disable background WordPress scheduler in production to avoid any periodic DB activity
      - key: ENABLE_WORDPRESS_SCHEDULER
        value: "false"
      # Supabase Auth config
      - key: SUPABASE_URL
        value: "https://rqoqtusrlsapcbdimwpn.supabase.co"
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        value: "https://rqoqtusrlsapcbdimwpn.supabase.co"
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: DISABLE_LOCAL_AUTH
        value: "true"
      # Manual WordPress sync key for secure triggers via header
      - key: WORDPRESS_SYNC_KEY
        sync: false
      # Public site and backend base URLs used by sitemap generation during build
      - key: SITE_URL
        value: "https://bubblescafe.space"
      - key: BACKEND_BASE_URL
        value: "https://api.bubblescafe.space"
      
    autoDeploy: true
