    <!-- Pre-paint theme initialization -->
    <script>
    (function () {
      try {
        var storageKey = 'vite-ui-theme';
        var stored = localStorage.getItem(storageKey);
        var candidate = stored;
        var theme;
        if (candidate && candidate !== 'system') {
          theme = candidate;
        } else {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var allowed = { dark: 1, light: 1, sky: 1, eco: 1 };
        if (!allowed[theme]) theme = 'light';
        var root = document.documentElement;
        root.classList.remove('light', 'dark', 'sky', 'eco');
        root.classList.add(theme);
        // Ensure native UI (scrollbars, form controls) match theme before CSS loads
        root.style.colorScheme = (theme === 'dark') ? 'dark' : 'light';
        // Pre-paint background to avoid white/black flash on very slow CSS arrival
        root.style.backgroundColor = (theme === 'dark') ? '#0a0a0a' : '#FAFAFA';
      } catch (e) {}
    })();
    </script>
