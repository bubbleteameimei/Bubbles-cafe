
name = "bubbles-cafe"
main = "src/index.ts"
compatibility_date = "2025-11-20"
account_id = "50154307e88967cd12ab1262230de6ac"


# Environment variables
[vars]
BACKEND_BASE_URL = "https://api.bubblescafe.space"
FRONTEND_URL = "https://bubblescafe.space"
NODE_ENV = "production"
ENABLE_WORDPRESS_SCHEDULER = "true"

# KV Namespaces
kv_namespaces = [
  { binding = "IDEMPOTENCY_KV", id = "2919525761cd4e6faa06bb219e4a293e" },
  { binding = "USER_CACHE_KV", id = "85dd5d1c736742afa1e0fce282ef548a" },
  { binding = "SYNC_METADATA_KV", id = "bfcdd8e8af824f05b392db8682891548" },
  { binding = "ANALYTICS_KV", id = "d0665e7aa4574e3192cce136a1ca3a23" },
  { binding = "CACHE_KV", id = "ffc0fafeb8724f27aa293bf9ddc49358" }
]

# Durable Objects - using local classes (no script_name)
[[durable_objects.bindings]]
name = "LOCKS_DO"
class_name = "LocksObject"

[[durable_objects.bindings]]
name = "RATE_LIMIT_DO"
class_name = "RateLimitObject"

[[durable_objects.bindings]]
name = "IDEMPOTENCY_DO"
class_name = "IdempotencyObject"

# Durable Objects migrations
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LocksObject", "RateLimitObject", "IdempotencyObject"]

# Cron triggers
[triggers]
crons = ["0 * * * *"]

# Custom domain routing
[[routes]]
pattern = "api.bubblescafe.space/*"
zone_name = "bubblescafe.space"

# Observability
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

