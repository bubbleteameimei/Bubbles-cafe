server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — same behavior as vercel.json rewrites
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: proxy API when running the static image without Vercel rewrites
    location /api/ {
        proxy_pass https://api.bubblescafe.space/api/;
        proxy_http_version 1.1;
        proxy_set_header Host api.bubblescafe.space;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
