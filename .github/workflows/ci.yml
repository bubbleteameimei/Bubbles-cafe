name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Verify package-lock.json is in sync (PR only)
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          # Regenerate lockfile in a throwaway workspace and fail if it changes
          npm install --package-lock-only
          git --no-pager diff --exit-code package-lock.json || (echo "package-lock.json is out of sync with package.json" && exit 1)
      - name: Install dependencies (deterministic)
        run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Build
        run: npm run build
      - name: Preview site and run axe (non-blocking)
        run: |
          set -e
          npx vite preview --port 3000 --host &
          PREVIEW_PID=$!
          for i in {1..30}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Preview is up"
              break
            fi
            sleep 1
          done
          npx axe-core --urls http://localhost:3000 || true
          kill $PREVIEW_PID || true
      - name: Bundle budget
        run: npm run budget
        env:
          BUNDLE_BUDGET_KB: '800'
      - run: npm test --silent
  e2e:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies (deterministic)
        run: npm ci
      - run: npm run e2e
      - run: npm run audit --if-present
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: trufflesecurity/trufflehog@main
        with:
          path: .

