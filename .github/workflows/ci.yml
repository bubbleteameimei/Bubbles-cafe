name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Verify package-lock.json is in sync
        run: |
          # Regenerate lockfile in a throwaway workspace and fail if it changes
          npm install --package-lock-only
          git --no-pager diff --exit-code package-lock.json || (echo "package-lock.json is out of sync with package.json" && exit 1)
      - name: Install dependencies (deterministic)
        run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npx axe-core --urls http://localhost:3000 || true
      - run: npm run build
      - run: npm run budget
        env:
          BUNDLE_BUDGET_KB: '800'
      - run: npm test --silent
  e2e:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies (deterministic)
        run: npm ci
      - run: npm run e2e
      - run: npm run audit --if-present
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: trufflesecurity/trufflehog@main
        with:
          path: .

