name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lockfile-sync-check:
    name: Guard: package.json vs package-lock.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for unsynced lockfile changes on PRs
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          PKG_CHANGED="$(echo "$CHANGED_FILES" | grep -E '^package.json

 || true)"
          LOCK_CHANGED="$(echo "$CHANGED_FILES" | grep -E '^package-lock.json

 || true)"
          if [ -n "$PKG_CHANGED" ] && [ -z "$LOCK_CHANGED" ]; then
            echo "::warning ::package.json changed but package-lock.json did not. Please run 'npm install --package-lock-only' and commit the lockfile."
          fi
      - name: Check for unsynced lockfile changes on pushes
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          BEFORE_SHA="${{ github.event.before }}"
          AFTER_SHA="${{ github.sha }}"
          CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
          PKG_CHANGED="$(echo "$CHANGED_FILES" | grep -E '^package.json

 || true)"
          LOCK_CHANGED="$(echo "$CHANGED_FILES" | grep -E '^package-lock.json

 || true)"
          if [ -n "$PKG_CHANGED" ] && [ -z "$LOCK_CHANGED" ]; then
            echo "::warning ::package.json changed but package-lock.json did not. A separate workflow will regenerate the lockfile."
          fi

  build-test:
    runs-on: ubuntu-latest
    needs: lockfile-sync-check
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies (deterministic)
        run: npm ci
      - run: npm run check
      - run: npm run lint
      - name: Build
        run: npm run build
      - name: Preview site and run axe (non-blocking)
        run: |
          set -e
          npx vite preview --port 3000 --host &
          PREVIEW_PID=$!
          for i in {1..30}; do
            if curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              echo "Preview is up"
              break
            fi
            sleep 1
          done
          npx axe-core --urls http://localhost:3000 || true
          kill $PREVIEW_PID || true
      - name: Bundle budget
        run: npm run budget
        env:
          BUNDLE_BUDGET_KB: '800'
      - run: npm test --silent

  e2e:
    runs-on: ubuntu-latest
    if: ${{ false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies (deterministic)
        run: npm ci
      - run: npm run e2e
      - run: npm run audit --if-present

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: trufflesecurity/trufflehog@main
        with:
          path: .

