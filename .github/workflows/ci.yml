name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Build client and server
        run: npm run build
        env:
          NODE_ENV: production
          # Provide a dummy DB URL for type-only build when not actually connecting
          DATABASE_URL: postgres://user:pass@localhost:5432/db
          SESSION_SECRET: dummy_session_secret_value_that_is_long_enough_for_prod_checks________________________________
      - name: Bundle budget
        run: npm run budget
      - name: Run unit tests
        run: npm test --silent
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: trufflesecurity/trufflehog@main
        with:
          path: .

