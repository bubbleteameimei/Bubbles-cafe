name: uptime-ping

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API /health
        run: |
          set -e
          curl -fsS -m 6 https://api.bubblescafe.space/health >/dev/null || true