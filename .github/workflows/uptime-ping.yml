name: uptime-ping

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API and Frontend
        run: |
          set +e
          urls=(
            "https://api.bubblescafe.space/health"
            "https://api.bubblescafe.space/api/health"
            "https://bubblescafe.space/"
          )
          for url in "${urls[@]}"; do
            echo "Pinging $url"
            curl -fsSL -m 8 -H "Cache-Control: no-cache" "$url" >/dev/null || true
          done