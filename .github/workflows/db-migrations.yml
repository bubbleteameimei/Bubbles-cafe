name: db-migrations

on:
  # Run automatically on version tags like v1.2.3
  push:
    tags:
      - "v*"
  # Allow manual runs from the Actions tab
  workflow_dispatch:

jobs:
  migrate-supabase:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Run Supabase schema migration
        # DATABASE_URL must be defined as a GitHub secret (e.g. SUPABASE_DATABASE_URL)
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set (SUPABASE_DATABASE_URL). Skipping DB migration."
            exit 0
          fi
          npx tsx scripts/migrate-supabase-schema.ts

      - name: Install PostgreSQL client (psql)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Apply retention jobs SQL
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret not set (SUPABASE_DATABASE_URL). Skipping retention job setup."
            exit 0
          fi
          psql "$DATABASE_URL" -f scripts/setup-retention-jobs.sql